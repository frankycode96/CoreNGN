      <text x="28" y="105" fill="#CAC4D0" font-size="11" font-weight="500">TASK ATTIVO</text>
      <text x="28" y="125" fill="#E6E1E5" font-size="12" font-weight="600">"Implement JWT auth with refresh"</text>

      <!-- Graph Flow -->
      <g transform="translate(24, 160)">
        <!-- Linea di collegamento -->
        <line x1="16" y1="20" x2="16" y2="280" stroke="#49454F" stroke-width="2" stroke-dasharray="4" />

        <!-- Nodo 1: Success -->
        <circle cx="16" cy="16" r="14" fill="#1E4620" stroke="#4CAF50" stroke-width="2" />
        <text x="11" y="21" fill="#4CAF50" font-size="14">✓</text>
        <text x="40" y="16" fill="#E6E1E5" font-size="13" font-weight="600">Context_Loader</text>
        <text x="40" y="30" fill="#938F99" font-size="10">Repo Truth: OK • 3 fatti iniettati</text>
        <text x="230" y="16" fill="#4CAF50" font-size="10">42ms</text>

        <!-- Nodo 2: Running -->
        <circle cx="16" cy="90" r="14" fill="#4A4458" stroke="#D0BCFF" stroke-width="2" />
        <text x="10" y="95" fill="#D0BCFF" font-size="14">⟳</text>
        <text x="40" y="90" fill="#D0BCFF" font-size="13" font-weight="600">SubWorker_Node</text>
        <text x="40" y="104" fill="#CAC4D0" font-size="10">AutoGen Sandbox • Round 2/3</text>
