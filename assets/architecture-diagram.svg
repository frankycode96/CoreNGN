        <text x="16" y="58" fill="#CAC4D0" font-size="10">Soluzione: Handler con try-except su decode</text>
        
        <!-- Explain Scoring Pill -->
        <rect x="16" y="70" width="256" height="26" rx="6" fill="#211F26" />
        <text x="24" y="87" fill="#D0BCFF" font-size="9">Score: 0.89 (BM25: 0.42 | Cosine CPU: 0.47)</text>
