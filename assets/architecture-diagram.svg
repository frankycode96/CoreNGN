  <!-- ==================== DISPOSITIVO 2: SUB-WORKER SANDBOX ==================== -->
  <g transform="translate(400, 110)" filter="url(#shadow)">
    <rect width="320" height="680" rx="36" fill="#1C1B1F" stroke="#49454F" stroke-width="3" />
    
    <g clip-path="url(#screenClip)">
