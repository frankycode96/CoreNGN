      <text x="26" y="106" fill="#D0BCFF" font-size="10">🔒 Scratchpad isolato: distruzione a fine task</text>

      <!-- Chat Stream -->
      <!-- Message 1: Coder -->
      <g transform="translate(16, 130)">
        <rect width="250" height="95" rx="14" fill="#2B2930" />
        <text x="14" y="22" fill="#D0BCFF" font-size="11" font-weight="700">🤖 Engineer (Coder)</text>
        <rect x="14" y="32" width="222" height="50" rx="6" fill="#1C1B1F" />
        <text x="20" y="48" fill="#4CAF50" font-size="9" font-family="monospace">class TokenService:</text>
        <text x="20" y="62" fill="#4CAF50" font-size="9" font-family="monospace">  def refresh(token: str):</text>
        <text x="20" y="74" fill="#4CAF50" font-size="9" font-family="monospace">    return generate_jwt()</text>
      </g>

      <!-- Message 2: Critic -->
      <g transform="translate(54, 235)">
        <rect width="250" height="75" rx="14" fill="#332D41" />
        <text x="14" y="22" fill="#FFB4AB" font-size="11" font-weight="700">🧐 Critic (Reviewer)</text>
        <text x="14" y="42" fill="#E6E1E5" font-size="10">Manca try-except sul parsing JWT.</text>
        <text x="14" y="58" fill="#E6E1E5" font-size="10">Aggiungi gestione token scaduto.</text>
      </g>

      <!-- Message 3: Coder V2 -->
      <g transform="translate(16, 320)">
        <rect width="250" height="85" rx="14" fill="#2B2930" />
        <text x="14" y="20" fill="#D0BCFF" font-size="11" font-weight="700">🤖 Engineer (Draft v2)</text>
        <rect x="14" y="28" width="222" height="45" rx="6" fill="#1C1B1F" />
        <text x="20" y="44" fill="#4CAF50" font-size="9" font-family="monospace">try: decode_jwt(t)</text>
        <text x="20" y="58" fill="#4CAF50" font-size="9" font-family="monospace">except ExpiredError: raise</text>
      </g>

      <!-- System-1 Assessment (senza caratteri speciali) -->
      <rect x="16" y="420" width="288" height="95" rx="12" fill="#211F26" stroke="#49454F" />
      <text x="26" y="440" fill="#CAC4D0" font-size="11" font-weight="700">VERIFICA DETERMINISTICA SYSTEM-1</text>
      <text x="26" y="460" fill="#4CAF50" font-size="10">✓ AST Parsing + Syntax: PASS (0 errori)</text>
      <text x="26" y="478" fill="#FFB4AB" font-size="10">✗ Noul Confidence: 0.61 (Soglia minima: 0.85)</text>
      <text x="26" y="498" fill="#E6E1E5" font-size="10" font-weight="600">Verdetto: RETRY ➔ Procedi a Round 3</text>

