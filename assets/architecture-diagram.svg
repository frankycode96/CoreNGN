      <text x="26" y="275" fill="#E6E1E5" font-size="10" font-family="monospace">def refresh_token(token: str):</text>
      <text x="26" y="295" fill="#E6E1E5" font-size="10" font-family="monospace">    payload = jwt.decode(token)</text>
      <text x="26" y="315" fill="#E6E1E5" font-size="10" font-family="monospace">    return create_jwt(payload)</text>
      <text x="26" y="345" fill="#4CAF50" font-size="9">✓ Pronto per commit episodico</text>

