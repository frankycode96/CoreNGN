        <text x="16" y="22" fill="#D0BCFF" font-size="10" font-weight="700">📌 DICHIARATIVA · IMMUTABILE</text>
        <rect x="235" y="10" width="40" height="16" rx="8" fill="#4F378B" />
        <text x="242" y="21" fill="#EADDFF" font-size="9">PIN</text>
        
        <text x="16" y="42" fill="#CAC4D0" font-size="11">key: token_expiration_seconds</text>
        <text x="16" y="58" fill="#E6E1E5" font-size="12" font-weight="600">value: 900 (15 minuti)</text>
        <text x="16" y="74" fill="#938F99" font-size="9">Non sovrascrivibile da upsert automatici</text>
      </g>

      <!-- Entry 2: Validated Episodic -->
