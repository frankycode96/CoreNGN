      <text x="45" y="555" fill="#E6E1E5" font-size="12">Scarta Round</text>

      <rect x="166" y="530" width="138" height="40" rx="20" fill="#D0BCFF" />
      <text x="180" y="555" fill="#381E72" font-size="12" font-weight="600">Forza Convergenza</text>

      <!-- Bottom Nav -->
      <rect x="0" y="615" width="320" height="65" fill="#211F26" />
      <text x="45" y="645" fill="#938F99" font-size="14">◈</text>
      <circle cx="115" cy="640" r="14" fill="#4A4458" />
      <text x="109" y="645" fill="#D0BCFF" font-size="14">💬</text>
      <text x="185" y="645" fill="#938F99" font-size="14">🧠</text>
      <text x="255" y="645" fill="#938F99" font-size="14">⚙</text>
