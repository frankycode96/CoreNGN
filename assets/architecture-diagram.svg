  <text x="60" y="85" fill="#938F99" font-size="15">Architettura Local-First: LangGraph FSM, AutoGen Sandbox, Gating System-1 e Memory Vault</text>

  <!-- ==================== DISPOSITIVO 1: PIPELINE TRACER ==================== -->
  <g transform="translate(60, 110)" filter="url(#shadow)">
