        <text x="16" y="42" fill="#938F99" font-size="10">File: ~/.agent_bridge/memory.db (2.1 MB)</text>
        
        <rect x="16" y="55" width="120" height="28" rx="14" fill="#36343B" />
        <text x="28" y="73" fill="#E6E1E5" font-size="10">Pota Obsolete</text>
        
        <rect x="146" y="55" width="126" height="28" rx="14" fill="#36343B" />
