      <text x="28" y="415" fill="#CAC4D0" font-size="11" font-weight="600">TIME TRAVEL + MODIFICA STATO</text>
      <text x="28" y="435" fill="#938F99" font-size="10">Modifica manualmente il payload prima</text>
      <text x="28" y="450" fill="#938F99" font-size="10">dell'invio allo store episodico SQLite.</text>
      
      <rect x="28" y="465" width="120" height="32" rx="16" fill="#36343B" />
      <text x="45" y="485" fill="#E6E1E5" font-size="11">Modifica Testo</text>
      <rect x="156" y="465" width="120" height="32" rx="16" fill="#36343B" />
      <text x="175" y="485" fill="#FFB4AB" font-size="11">Rifiuta Bozza</text>

      <!-- Confirm Action Button -->
      <rect x="16" y="530" width="288" height="46" rx="23" fill="#D0BCFF" />
      <text x="80" y="558" fill="#381E72" font-size="13" font-weight="700">Approva e Consolida</text>

      <!-- Bottom Nav -->
      <rect x="0" y="615" width="320" height="65" fill="#211F26" />
      <text x="45" y="645" fill="#938F99" font-size="14">◈</text>
      <text x="115" y="645" fill="#938F99" font-size="14">💬</text>
      <circle cx="185" cy="640" r="14" fill="#4A4458" />
      <text x="179" y="645" fill="#D0BCFF" font-size="14">🧠</text>
      <text x="255" y="645" fill="#938F99" font-size="14">⚙</text>
    </g>
  </g>

  <!-- ==================== DISPOSITIVO 4: MEMORY VAULT & CURATION ==================== -->
