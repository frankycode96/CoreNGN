      <rect x="294" y="20" width="14" height="8" rx="2" fill="#E6E1E5" />

      <!-- App Bar -->
      <text x="20" y="65" fill="#E6E1E5" font-size="18" font-weight="700">Pipeline Tracer</text>
      <rect x="185" y="50" width="60" height="20" rx="10" fill="#2B2930" />
      <text x="193" y="64" fill="#D0BCFF" font-size="10">feat/auth</text>
      <circle cx="260" cy="60" r="4" fill="#4CAF50" />
